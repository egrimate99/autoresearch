dataset:
  split: train
  num_scrs: 1024
  only_implementable: true

domain:
  n_agents: 3
  n_states: 8
  n_alternatives: 7
  preference_type: ordinal

mechanism:
  message_scaffold: variable_latent_game_form
  max_messages_per_agent: 3
  deterministic_outcomes: true

training:
  seed: 0
  epochs: 80
  batch_size: 32
  lr: 0.0005
  hidden_dim: 256
  device: cpu
  effective_num_scrs: 2048
  rl_steps: 0
